# Une seule dépendance, et elle publie une version tous les trois jours : swift-psl suit la
# liste des suffixes publics, qui bouge dès qu'un registre ajoute une extension. Cent
# soixante-quatre versions à ce jour.
#
# D'où le rythme mensuel plutôt que le réglage par défaut. Une proposition par semaine pour
# un fichier de données finit par se fermer sans être lue — et c'est ainsi qu'on rate celle
# qui comptait.
#
# **Cette liste n'est pas cosmétique.** Elle décide où s'arrête « ce site » : périmée, une
# exception de blocage posée sur une extension récente déborde sur les pages de tout le
# monde, ou ne s'applique pas là où on la croit. C'est une donnée de sécurité.
version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "Dépendances"
